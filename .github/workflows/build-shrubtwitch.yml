name: Build ShrubTwitch IPA

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Makefile'
      - '.github/workflows/build-shrubtwitch.yml'
      - '.github/scripts/**'
      - 'Assets/shrubtwitch-icon.png'
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Optional direct URL for YOUR decrypted Twitch IPA (use TWITCH_IPA_URL variable automatically)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: shrubtwitch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dylib + inject IPA
    runs-on: macos-15
    timeout-minutes: 25
    env:
      THEOS: ${{ github.workspace }}/.theos-toolchain
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      IPA_SOURCE: ${{ inputs.ipa_url || vars.TWITCH_IPA_URL || secrets.TWITCH_IPA_URL }}
    steps:
      - name: Checkout ShrubTwitch
        uses: actions/checkout@v4

      - name: Validate saved IPA URL (before expensive setup)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IPA_SOURCE" ]; then
            echo 'ERROR: Set TWITCH_IPA_URL under Settings > Secrets and variables > Actions, or supply ipa_url when manually running the workflow.' >&2
            exit 1
          fi
          case "$IPA_SOURCE" in
            https://*) echo 'IPA URL provided (hidden from logs).' ;;
            *) echo 'ERROR: TWITCH_IPA_URL must be a direct HTTPS file URL.' >&2; exit 1 ;;
          esac

      # Small dylib cache: when only the IPA changes, SKIP the entire native build.
      - name: Restore compiled dylib
        id: dylib-cache
        uses: actions/cache@v4
        with:
          path: .buildcache/ShrubTwitch.dylib
          key: shrubtwitch-dylib-v3-${{ runner.os }}-${{ hashFiles('Makefile', 'Sources/**/*') }}

      - name: Restore Theos and patched SDK
        if: steps.dylib-cache.outputs.cache-hit != 'true'
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: .theos-toolchain
          key: shrubtwitch-theos-xcode-${{ runner.os }}-v3

      - name: Setup Theos (first cache miss only)
        if: steps.dylib-cache.outputs.cache-hit != 'true' && steps.theos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          echo 'Theos installed.'

      - name: Link runner iPhoneOS SDK
        if: steps.dylib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test -d "$SDK_PATH"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "iPhoneOS SDK ${SDK_VERSION}"

      - name: Install and verify tools before compilation
        shell: bash
        run: |
          set -euo pipefail
          # Theos signs the compiled dylib DURING make. Installing ldid after
          # compilation caused the previous Error 127 failure.
          if [ "${{ steps.dylib-cache.outputs.cache-hit }}" != "true" ]; then
            brew install make ldid
            echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
            test -f "$THEOS/makefiles/common.mk"
            test -d "$THEOS/sdks"
          elif ! command -v ldid >/dev/null 2>&1; then
            # Cache hit: only the injector requires ldid; no compiler setup.
            brew install ldid
          fi
          command -v ldid >/dev/null 2>&1 || { echo 'ERROR: ldid is missing; aborting before expensive compilation.' >&2; exit 1; }
          echo "ldid available: $(command -v ldid)"

      - name: Compile ShrubTwitch.dylib
        if: steps.dylib-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$THEOS/bin:$PATH"
          make -j"$(sysctl -n hw.ncpu)" FINALPACKAGE=1 TARGET="iphone:clang:${SDK_VERSION}:14.0"
          mkdir -p .buildcache
          DYLIB=$(find .theos -name 'ShrubTwitch.dylib' -type f -print -quit)
          if [ -z "$DYLIB" ]; then
            echo 'ERROR: ShrubTwitch.dylib was not built.' >&2
            find .theos -name '*.dylib' || true
            exit 1
          fi
          cp "$DYLIB" .buildcache/ShrubTwitch.dylib
          file .buildcache/ShrubTwitch.dylib

      - name: Install isolated IPA injector dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/shrubtwitch-python"
          "$RUNNER_TEMP/shrubtwitch-python/bin/python" -m pip install --quiet --disable-pip-version-check --only-binary=:all: 'lief==0.17.6'
          "$RUNNER_TEMP/shrubtwitch-python/bin/python" -c 'import lief; print("LIEF version:", lief.__version__)'
          test -s .buildcache/ShrubTwitch.dylib
          file .buildcache/ShrubTwitch.dylib
          command -v ldid

      - name: Fetch YOUR decrypted Twitch IPA
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$IPA_SOURCE" ]; then
            echo 'Missing IPA. Add repository variable TWITCH_IPA_URL with a direct downloadable link to your own decrypted Twitch IPA, or fill in the workflow input ipa_url.' >&2
            exit 1
          fi
          # Do not print the URL or signed query tokens in logs.
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 25 --max-time 300 "$IPA_SOURCE" -o "$RUNNER_TEMP/Twitch.ipa"
          python3 - <<'PY'
          import os, zipfile
          path = os.path.join(os.environ['RUNNER_TEMP'], 'Twitch.ipa')
          if not zipfile.is_zipfile(path):
              raise SystemExit('Downloaded file is not an IPA/ZIP. Use a DIRECT file URL (not a sharing-page URL).')
          with zipfile.ZipFile(path) as z:
              if not any(n.startswith('Payload/') and n.endswith('/Info.plist') for n in z.namelist()):
                  raise SystemExit('IPA has no Payload/*.app/Info.plist. Is this a decrypted Twitch IPA?')
          print('Twitch IPA verified:', round(os.path.getsize(path)/1048576,1), 'MiB')
          PY

      - name: Inject dylib + package ShrubTwitch IPA
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/shrubtwitch-python/bin/python" .github/scripts/inject_ipa.py \
            "$RUNNER_TEMP/Twitch.ipa" \
            .buildcache/ShrubTwitch.dylib \
            "$RUNNER_TEMP/output"
          IPA_FILE="$(find "$RUNNER_TEMP/output" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          test -s "$IPA_FILE" || { echo 'ERROR: Injector produced no nonempty IPA.' >&2; exit 1; }
          echo "IPA_OUTPUT=$IPA_FILE" >> "$GITHUB_ENV"

      - name: Publish public IPA + dylib GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo 'ERROR: GitHub CLI (gh) missing.' >&2; exit 1; }
          test -n "${IPA_OUTPUT:-}" && test -s "$IPA_OUTPUT" || { echo 'ERROR: Missing IPA; refusing to create a release.' >&2; exit 1; }
          test -s .buildcache/ShrubTwitch.dylib || { echo 'ERROR: Missing dylib; refusing to create a release.' >&2; exit 1; }
          TAG="v1.2.0-build.${GITHUB_RUN_NUMBER}-r${GITHUB_RUN_ATTEMPT}"
          NOTES="$RUNNER_TEMP/shrubtwitch-release-notes.md"
          cat > "$NOTES" <<EOF
          ## ShrubTwitch v1.2.0

          Publicly available downloads:
          - **ShrubTwitch IPA** — patched iOS app, requires signing with your own certificate before installing.
          - **ShrubTwitch.dylib** — standalone tweak library.

          Source commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}

          Source code and third-party attribution are in this repository.
          EOF
          gh release create "$TAG" "$IPA_OUTPUT" .buildcache/ShrubTwitch.dylib \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ShrubTwitch v1.2.0 · Build #${GITHUB_RUN_NUMBER}" \
            --notes-file "$NOTES" --latest
          {
            echo '## Public ShrubTwitch IPA release published'
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo 'Both the patched IPA and dylib are publicly downloadable from **Releases**.'
            echo 'No GitHub Actions artifacts were uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
